# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cmf-bananapi-vcpe"
BBFILE_PATTERN_meta-cmf-bananapi-vcpe = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cmf-bananapi-vcpe = "10"

LAYERDEPENDS_meta-cmf-bananapi-vcpe = "core"
LAYERSERIES_COMPAT_meta-cmf-bananapi-vcpe = "kirkstone"

# TOPDIR is not a build input, but meta-cmf/classes/coverity.bbclass embeds a
# literal ${TOPDIR}/../build-images/... into do_compile_prepend/do_compile_append,
# so the build directory's absolute path lands in the do_compile basehash of every
# recipe that inherits coverity -- rdk-logger, rbus, commonutilities, telemetry,
# libsyswrapper, dca, nlmonitor and friends. Those sit at the bottom of the
# dependency graph, so the miss cascades and two otherwise-identical trees share
# almost no sstate: measured 65 of 67 non-shareable tasks between two trees that
# differed only in path. The coverity code is dead unless COVERITY_REQUIRED=1.
#
# Must be _append (deferred to finalize) rather than +=: bitbake.conf sets this
# with ?= and is parsed after layer.conf, so an immediate += here would suppress
# the ?= and drop every default entry.
BB_BASEHASH_IGNORE_VARS_append = " TOPDIR"
