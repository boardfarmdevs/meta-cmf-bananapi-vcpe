# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cmf-bananapi-vcpe"
BBFILE_PATTERN_meta-cmf-bananapi-vcpe = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cmf-bananapi-vcpe = "10"

LAYERDEPENDS_meta-cmf-bananapi-vcpe = "core"
LAYERSERIES_COMPAT_meta-cmf-bananapi-vcpe = "kirkstone"
