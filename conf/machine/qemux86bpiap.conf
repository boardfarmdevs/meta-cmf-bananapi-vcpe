#@TYPE: Machine
#@NAME: qemux86bpiap
#@NEEDED_BSPLAYERS: meta-cmf-bananapi
#@RDK_FLAVOR: rdkb
#@DESCRIPTION: Banana Pi R4 RDK-B EasyMesh AP-extender userspace built for x86, packaged as an LXC container

require conf/machine/qemux86.conf

MACHINE_IMAGE_NAME = "X86EMLTRBPIAP"

# Inherit bananapi / mt7988 / filogic / broadband overrides so userspace bbappends still apply.
# (No recipe keys off a ":bananapi4-rdk-broadband-ap-extender" override specifically -- role
# selection for EasyMesh AP-extender vs controller is driven entirely by the em_extender /
# EasyMesh / with_alsap DISTRO_FEATURES below, same as the real bananapi4-rdk-broadband-ap-extender.conf
# vs bananapi4-rdk-broadband.conf split does via rdk-bpi-ap-extender.inc vs rdk-bpi.inc.)
MACHINEOVERRIDES .= ":broadband"
MACHINEOVERRIDES .= ":bananapi4-rdk-broadband"
MACHINEOVERRIDES .= ":mt7988"
MACHINEOVERRIDES .= ":filogic"

DISTRO_FEATURES_append = " parodus referencepltfm WanFailOverSupportEnable"
DISTRO_FEATURES_append_broadband = " core-net-lib rdkb_wan_manager"
DISTRO_FEATURES_append_broadband = " WanManagerUnificationEnable halVersion3"
# Needed so ccsp-common-library installs RdkFwUpgradeManager.service.
DISTRO_FEATURES_append_broadband = " fwupgrade_manager"
DISTRO_FEATURES_remove = " bluetooth bluez5 rdkb_inter_device_manager"
# Unlike qemux86bpibroadband.conf: keep EasyMesh (this is the whole point of this MACHINE),
# still strip sdmmc/kernel6-6 -- no SD card or real Filogic kernel path in an LXC container.
DISTRO_FEATURES_remove = " sdmmc kernel6-6"

# EasyMesh AP-extender role switches -- these are what unified-wifi-mesh.bb / ieee1905-em.bb
# (meta-cmf-broadband/recipes-ccsp/{unified-wifi-mesh,ieee1905}) branch on to build the
# extender-side agent (vs. controller) and to enable AL_SAP, matching the wiki's documented
# "Default build with AL_SAP" for the extender. Mirrors
# meta-cmf-bananapi/conf/distro/include/rdk-bpi-ap-extender.inc's em_extender/EasyMesh/with_alsap
# lines -- not require'd directly because that .inc also pulls in real-hardware-only features
# (sdmmc, kernel6-6, CONFIG_IEEE80211BE/generic_mlo MLO, etc.) that don't apply to a container.
DISTRO_FEATURES_append = " em_extender EasyMesh with_alsap"

# Container shares host kernel.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
DEPENDS_remove_pn-utopia_qemux86bpiap = "kernel-autoconf"

# These x86 lab images run only with the Linux 7.0 hwsim pool installed by
# gen/hwsim/build-hwsim.sh --6ghz. Keep the complete tri-band radio model in
# every clean build rather than relying on an untracked local.conf override.
HWSIM_6GHZ_CAPABLE = "1"

PREFERRED_PROVIDER_hal-wifi_onewifi = "hal-wifi-generic"

# Strip MACHINE from PACKAGE_EXTRA_ARCHS to avoid duplicate with MACHINE_ARCH.
PACKAGE_EXTRA_ARCHS_remove = "${MACHINE}"

# Mask BSP / kernel / wifi drivers / bootloader / atf: nothing below runs in LXC.
BBMASK .= "|.*meta-filogic/(?!recipes-ccsp/hal/hal-fwupgrade|recipes-wifi/(ucode|libnl-tiny|ubus|uci)/).*"
BBMASK .= "|.*meta-cmf-filogic/recipes-bsp/.*"
BBMASK .= "|.*meta-cmf-filogic/recipes-kernel/.*"
BBMASK .= "|.*meta-cmf-bananapi/meta-rdk-mtk-bpir4/recipes-bsp/.*"
BBMASK .= "|.*meta-cmf-bananapi/meta-rdk-mtk-bpir4/recipes-kernel/.*"
BBMASK .= "|.*meta-cmf-bananapi/meta-rdk-mtk-bpir4/recipes-wifi/.*"
BBMASK .= "|.*meta-cmf-bananapi/meta-rdk-mtk-bpir4/recipes-connectivity/atf.*"
BBMASK .= "|.*recipes-bsp/u-boot.*"

# Mask image / packagegroup bbappends pulling mt7988-only RDEPENDS. This also masks
# rdk-generic-ap-extender-image.bbappend and packagegroup-ap-extender.bbappend, both of which
# are real-hardware-only (mtk-factory-rw, mtd, u-boot-fw-utils, veritysetup/fitImage sysupgrade
# tasks, bpi-macaddress/bpi-serialnumber/mount-nvram). Their base (meta-rdk) recipes are empty
# shells by design -- the software RDEPENDS that actually matter (ccsp-one-wifi, rbus, ccsp-cr,
# ccsp-cr-ccsp, sysint-broadband, ccsp-common-startup, ccsp-gwprovapp) are already installed by
# the existing broadband container image; only unified-wifi-mesh and ieee1905-em are genuinely
# missing, added explicitly below instead of trying to unmask the hardware-tied bbappend.
BBMASK .= "|.*meta-cmf-filogic/recipes-core/images/.*"
BBMASK .= "|.*meta-cmf-filogic/recipes-devtools/.*"
BBMASK .= "|.*meta-cmf-bananapi/meta-rdk-mtk-bpir4/recipes-core/.*"
BBMASK .= "|.*meta-cmf-bananapi/meta-rdk-mtk-bpir4/recipes-devtools/.*"

# Misc kernel-module / internal-gerrit bits.
BBMASK .= "|.*meta-rdk-broadband/recipes-ccsp/ccsp/ccsp-hotspot-kmod.bb"
BBMASK .= "|.*meta-rdk-ext/recipes-core/glib-networking/glib-networking_2.48.2.bb"
BBMASK .= "|.*openembedded-core/meta/recipes-kernel/make-mod-scripts/make-mod-scripts_1.0.bb"
BBMASK .= "|.*meta-rdk-ext/recipes-kernel/nat46/.*"
BBMASK .= "|.*meta-rdk/recipes-support/base64/base64_git.bb"
BBMASK .= "|.*meta-rdk-broadband/recipes-rdkb/sysint-broadband/sysint-broadband-min.bb"

# Mask HAL bbappends that patch absent gerrit source; we overlay instead.
BBMASK .= "|.*meta-cmf-filogic/recipes-ccsp/hal/.*"
BBMASK .= "|.*meta-cmf-bananapi/meta-rdk-mtk-bpir4/recipes-ccsp/hal/(hal-platform-generic|hal-ethsw-generic).*"

PREFERRED_VERSION_lighttpd = "1.4.53"
PREFERRED_VERSION_nmap = "7.80"
PREFERRED_VERSION_python3-jinja2-native = "3.1.1"
PREFERRED_PROVIDER_ps = "procps"

RDEPENDS_packagegroup-rdk-oss-broadband_remove   = "mt76 mt7988-wifi rtl88x2bu rtl8812au rtl8192eu"
RDEPENDS_packagegroup-rdk-ccsp-broadband_remove  = "ccsp-hotspot-kmod xupnp"

IMAGE_INSTALL_append = " vcpe-init"

# Force-install ccsp-gwprovapp (bpir4 packagegroup that normally pulls it is masked).
IMAGE_INSTALL_append = " ccsp-gwprovapp"

# Core CCSP components rdk-generic-ap-extender-image's own package set doesn't pull in
# (unlike rdk-generic-broadband-image, its IMAGE_INSTALL is just packagegroup-rdk-oss-broadband
# + the masked packagegroup-ap-extender -- confirmed missing from the manifest on
# 2026-08-04, notably sysint-broadband, which is what generates /etc/device.properties
# at postinst; onewifi.service's EnvironmentFile= references it unconditionally and fails
# to start without it).
IMAGE_INSTALL_append = " ccsp-common-library ccsp-common-startup sysint-broadband ccsp-cr ccsp-cr-ccsp ccsp-one-wifi"

# ccsp-psm (Persistent Storage Manager): onewifi.service reads its WiFi config via a
# synchronous PSM RPC (rbus/dbus) at startup. Without it, PsmSsp.service fails outright
# (/usr/bin/PsmSsp: No such file or directory -- its own .service unit ships via
# sysint-broadband/ccsp-common-library regardless of whether ccsp-psm itself is
# installed) and OneWifi hangs forever on a futex wait for a PSM response that never
# comes, instead of erroring. Confirmed present in the broadband controller's image;
# missing here for the same reason as the other core CCSP packages above.
IMAGE_INSTALL_append = " ccsp-psm ccsp-psm-ccsp"

# ccsp-misc ships /etc/migration_to_psm.sh -- PsmSsp.service's ExecStartPost (no leading
# "-", so its failure is fatal to the whole unit) runs it unconditionally. Without it,
# PsmSsp exits 127 right after actually starting successfully.
IMAGE_INSTALL_append = " ccsp-misc ccsp-misc-ccsp"

# EasyMesh AP-extender components -- the actual delta vs. the broadband container image.
# unified-wifi-mesh: em_agent (this pass builds the em_extender/agent-side binary + service,
# per unified-wifi-mesh.bb's em_extender conditional). ieee1905-em: IEEE 1905 Rust agent, same
# em_extender conditional selects the extender service instead of ctrl+cli.
IMAGE_INSTALL_append = " unified-wifi-mesh ieee1905-em"

IMAGE_FSTYPES = "tar.gz lxc"
IMAGE_CLASSES += "image_types_lxc"
IMAGE_INSTALL_remove = " e2fsprogs breakpad-staticdev"

# Lab crash-dump demo + crash-upload adapter (recipes-vcpe/breakpad-demo).
IMAGE_INSTALL_append = " breakpad-demo"

DL_DIR    = "${HOME}/oe/downloads"
SSTATE_DIR = "${HOME}/oe/sstate-cache"
