name: easymesh-observability

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    user: "65534:65534"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./tls:/etc/prometheus/tls:ro
      - prometheus-data:/prometheus
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.1}
    user: "472:472"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://127.0.0.1:13000/}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  prometheus-data:
  grafana-data:
