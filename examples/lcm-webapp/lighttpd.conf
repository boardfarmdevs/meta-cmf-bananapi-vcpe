server.document-root = "/var/www/htdocs"
server.port          = 8888
server.bind          = "0.0.0.0"
server.errorlog      = "/dev/stderr"

server.modules       = ( "mod_indexfile", "mod_dirlisting", "mod_staticfile" )

index-file.names     = ( "index.html" )

mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".ico"  => "image/x-icon",
    ".txt"  => "text/plain"
)
