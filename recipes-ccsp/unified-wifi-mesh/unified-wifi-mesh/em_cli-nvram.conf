# onewifi_em_cli is the controller-side web UI. It reads its web assets from
# /nvram/static and the controller endpoint from /nvram/remoteCtrl.json. Refresh
# packaged static assets on every start because same-node redeploys preserve
# /nvram; it is state storage, not a versioned WebUI installation source.
#
# /nvram is a ZFS-backed volume that PERSISTS across redeploys, so anything
# written there once survives. em_cli runs co-located with em_ctrl and reaches it
# on the controller's unix command socket (/tmp/onewifi_mesh_ctrl, patch 0281),
# whatever remoteCtrl.json says: libemcli ignores the address. The UI still reads
# the file and reports the address in it, and a stale erouter0 DHCP lease left
# there from a previous boot is what it would report, so the file is still
# (re)written to loopback on every start, not only-if-absent. Keys are lowercase
# ip/port (string) -- that is what the binary reads.
#
# StartLimitIntervalSec=0 + Restart keep a transient early-boot failure (e.g.
# racing OneWifi bring-up) from latching the unit into start-limit-hit, which
# left em_cli dead-with-no-journal after a container restart.
[Unit]
StartLimitIntervalSec=0

[Service]
# The web UI's address (EM_CLI_LISTEN, patch 0282): the recipe writes the file from
# EASYMESH_WEBUI_LISTEN, a file an image without systemd can read the same way. Required:
# the recipe always installs it.
EnvironmentFile=/etc/default/onewifi_em_cli
# Percent specifiers are expanded by systemd before /bin/sh sees the command;
# %% is required to pass a literal % to printf.
ExecStartPre=/bin/sh -c 'mkdir -p /nvram/static && cp -rf /usr/ccsp/EasyMesh/static/. /nvram/static/ 2>/dev/null; printf "%%s" "{\\\"ip\\\":\\\"127.0.0.1\\\",\\\"port\\\":\\\"49153\\\"}" > /nvram/remoteCtrl.json; true'
Restart=on-failure
RestartSec=3
