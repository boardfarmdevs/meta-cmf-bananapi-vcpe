# onewifi_em_cli is the controller-side web UI. It reads its web assets from
# /nvram/static and the controller endpoint from /nvram/remoteCtrl.json.
#
# /nvram is a ZFS-backed volume that PERSISTS across redeploys, so anything
# written there once survives. The controller pointer must therefore be forced
# on every start, not written only-if-absent: em_cli runs co-located with
# em_ctrl, whose CLI listener is always reachable on 127.0.0.1:49153, but a
# stale erouter0 DHCP lease left in remoteCtrl.json from a previous boot would
# send the UI to a dead address and render a blank page. Always (re)write it to
# loopback. Keys are lowercase ip/port (string) -- that is what the binary reads.
#
# StartLimitIntervalSec=0 + Restart keep a transient early-boot failure (e.g.
# racing OneWifi bring-up) from latching the unit into start-limit-hit, which
# left em_cli dead-with-no-journal after a container restart.
[Unit]
StartLimitIntervalSec=0

[Service]
# Percent specifiers are expanded by systemd before /bin/sh sees the command;
# %% is required to pass a literal % to printf.
ExecStartPre=/bin/sh -c 'mkdir -p /nvram/static && cp -rn /usr/ccsp/EasyMesh/static/. /nvram/static/ 2>/dev/null; printf "%%s" "{\\\"ip\\\":\\\"127.0.0.1\\\",\\\"port\\\":\\\"49153\\\"}" > /nvram/remoteCtrl.json; true'
Restart=on-failure
RestartSec=3
