# Publish the interactive wmediumd world viewer and the golden world plans
# to GitHub Pages. Enable Pages with source "GitHub Actions" once in the
# repository settings; after that every push to the listed branches deploys.
name: world viewer

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - gen/wmediumd/configurator/worlds/**
      - .github/workflows/world-viewer-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify golden worlds match their layout and mobility sources
        working-directory: gen/wmediumd/configurator
        run: ./worlds/build-goldens.sh --check

  deploy:
    needs: check-goldens
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site/golden site/viewer
          cp gen/wmediumd/configurator/worlds/golden/*.world.json site/golden/
          cp gen/wmediumd/configurator/worlds/viewer/index.html site/viewer/
          printf '<meta http-equiv="refresh" content="0; url=viewer/">' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
